# Lab-wide build defaults for the cads-zero seed in this image.
#
# Overlay on cads-zero's firmware.conf (CMake: -DCADS_FIRMWARE_CONF): only the
# keys listed here change; everything else keeps the value from firmware.conf.
# Same `key = value` syntax as the board's /config.txt. Settable keys:
# boot.autostart, display.brightness, display.fast_clock, net.dhcp, net.ip,
# net.netmask, net.gateway, net.mac_random, wifi.enabled, wifi.uart,
# wifi.pcap_target.
#
# Example (board address of the lab network):
#   net.ip      = 172.16.0.201
#   net.netmask = 255.255.255.0
#   net.gateway = 172.16.0.1
#
# In the student workspace the file is cads-zero/firmware.lab.conf (untracked);
# changing it re-runs CMake on the next "CaDS: Build". Nothing is listed by
# default: the image builds with cads-zero's own defaults.
