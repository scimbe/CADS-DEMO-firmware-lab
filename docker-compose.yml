# CaDS Firmware Lab - local/dev run of the image (SPEC.md §4).
#
# The lab deployment on cads-lambda uses a plain `docker run` (no compose), so
# everything that matters for correctness (CMD flags, settings, seed) lives in
# the image itself; this file only adds the runtime bits: password, LLM
# credentials, the workspace volume and the loopback port mapping.
#
# No USB passthrough, no device rules: the board is at the student's computer
# and is driven from the browser (WebUSB via cads-probe).
#
#   cp .env.example .env            # set FIRMWARE_LAB_PASSWORD (+ TUTOR_LLM_*)
#   docker compose build
#   docker compose up -d
#   open http://127.0.0.1:8084
services:
  firmware-lab:
    build:
      context: .
      args:
        # Seed source: public mirror, branch praktikum/start (Dockerfile defaults).
        # Override with a branch or a 40-hex commit: CADS_ZERO_REF=<ref> docker compose build
        CADS_ZERO_REF: ${CADS_ZERO_REF:-praktikum/start}
    image: cads-firmware-lab:latest
    container_name: firmware-lab-dev
    restart: unless-stopped
    environment:
      - PASSWORD=${FIRMWARE_LAB_PASSWORD:?set FIRMWARE_LAB_PASSWORD (in .env) before starting}
      - TUTOR_LLM_BASE_URL=${TUTOR_LLM_BASE_URL:-}
      - TUTOR_LLM_API_KEY=${TUTOR_LLM_API_KEY:-}
      - TUTOR_LLM_MODEL=${TUTOR_LLM_MODEL:-}
    ports:
      # Loopback only. 8084 locally (8083 is the older deployment's port and
      # stays untouched); on the lab host the tunnel target is 127.0.0.1:8083.
      - "127.0.0.1:${FIRMWARE_LAB_PORT:-8084}:8080"
    volumes:
      # The student's cads-zero checkout lives here (seeded on first start).
      - firmware-lab-workspace:/home/coder/workspace

volumes:
  firmware-lab-workspace:
