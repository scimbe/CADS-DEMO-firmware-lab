# Default target: Nucleo-F429ZI's onboard ST-Link/V2-1 + STM32F429ZI. target/stm32f4x.cfg is
# OpenOCD's shared script for the whole STM32F4 line (chip-ID auto-detected), so this also covers
# other F4 boards (e.g. the F401RE this example originally targeted) without changes here.
# Override this file entirely (or bind-mount a different one at /workspace/openocd.cfg) for a
# non-F4 board -- e.g. target/stm32f1x.cfg for a "Blue Pill" STM32F103.
source [find interface/stlink.cfg]
source [find target/stm32f4x.cfg]
