# CaDS Tutor Lab - multi-arch image build for ghcr.io/scimbe/cads-tutor-lab
# (images/tutor-lab/Dockerfile, SPEC.md Addendum v1.1 A4).
#
# Same shape as image.yml (firmware image): the seed build inside the
# Dockerfile (cargo build/test, node --test) is slow under QEMU, so each
# architecture is built natively - ubuntu-latest (amd64) and ubuntu-24.04-arm
# (arm64) push one image by digest, a final job stitches them into one
# multi-arch manifest with the tags
#   <branch>-<shortsha>, <branch>, and (main only) latest.
#
# No repository secrets are needed: everything the image downloads is public
# (Node tarball, rustup, Open VSX, CodeLLDB release) and checksum/version pinned.

name: image-tutor-lab

on:
  push:
    branches: [next, main]
    paths:
      - images/tutor-lab/**
      - extensions/cads-tutor/**
      - courses/rust-foundations/**
      - courses/javascript-foundations/**
      - workspaces/**
      - .dockerignore
      - .github/workflows/image-tutor-lab.yml
  workflow_dispatch:
    inputs:
      rust_toolchain:
        description: rustup toolchain to install (default "stable" from the Dockerfile)
        required: false
        default: ""

env:
  IMAGE: ghcr.io/scimbe/cads-tutor-lab

jobs:
  # 1. Package the cads-tutor extension into extensions/cads-tutor/dist/*.vsix.
  #    Tolerant: no package.json -> no VSIX -> the image is built without it.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package cads-tutor VSIX
        shell: bash
        run: |
          set -euo pipefail
          dir=extensions/cads-tutor
          if [ ! -f "$dir/package.json" ]; then echo "skip $dir (no package.json)"; exit 0; fi
          ( cd "$dir" && npm ci && npm run package )
          ls -l "$dir"/dist/*.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-tutor-lab
          path: extensions/cads-tutor/dist/*.vsix
          if-no-files-found: ignore
          retention-days: 7

  # 2. Native build + push by digest per architecture.
  build:
    needs: extension
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch packaged VSIX (if any)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vsix-tutor-lab
          path: extensions/cads-tutor/dist
      - name: Show what goes into the image
        run: |
          ls -l extensions/cads-tutor/dist/*.vsix 2>/dev/null || echo "no cads-tutor VSIX in this build"
          for c in rust-foundations javascript-foundations; do
            [ -f "courses/$c/course.json" ] && echo "course pack: $c" || echo "course pack missing: $c"
            [ -d "workspaces/$c" ] && echo "workspace: $c" || echo "workspace missing: $c (placeholder will be seeded)"
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/tutor-lab/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            ${{ inputs.rust_toolchain != '' && format('RUST_TOOLCHAIN={0}', inputs.rust_toolchain) || '' }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=tutor-lab-${{ matrix.arch }}
          cache-to: type=gha,scope=tutor-lab-${{ matrix.arch }},mode=max
          provenance: false
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "${{ matrix.arch }}: $digest"
      - uses: actions/upload-artifact@v4
        with:
          name: tutor-lab-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 3. One multi-arch manifest, tagged.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: tutor-lab-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest and tags
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME//\//-}"
          short="${GITHUB_SHA::7}"
          tags=("$IMAGE:$branch-$short" "$IMAGE:$branch")
          [ "$GITHUB_REF_NAME" = "main" ] && tags+=("$IMAGE:latest")
          args=()
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          cd /tmp/digests
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)
          echo "tags: ${tags[*]}"
      - name: Inspect
        run: |
          docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
