# CaDS Firmware Lab - multi-arch image build for ghcr.io/scimbe/cads-firmware-lab.
#
# The firmware smoke build inside the Dockerfile (cmake --preset itsboard, host
# ctest) is far too slow under QEMU, so each architecture is built natively:
# ubuntu-latest (amd64) and ubuntu-24.04-arm (arm64) push one image by digest,
# a final job stitches them into one multi-arch manifest with the tags
#   <branch>-<shortsha>, <branch>, and (main only) latest.
#
# Secrets: CADS_ZERO_TOKEN - read-only token for the private cads-zero repo,
# handed to the Dockerfile as BuildKit secret "gh_token" (never in a layer).
# Set by the repo owner: gh secret set CADS_ZERO_TOKEN   (see docs/IMAGE-NOTES.md)

name: image

on:
  push:
    branches: [next, main]
    paths:
      - Dockerfile
      - .dockerignore
      - image/**
      - extensions/**
      - courses/**
      - .github/workflows/image.yml
  workflow_dispatch:
    inputs:
      cads_zero_ref:
        description: cads-zero commit to seed (default from the Dockerfile)
        required: false
        default: ""

env:
  IMAGE: ghcr.io/scimbe/cads-firmware-lab

jobs:
  # 1. Package the CaDS extensions (cads-probe, cads-board-bridge, cads-tutor)
  #    into extensions/*/dist/*.vsix. Tolerant: directories that do not exist
  #    yet or have no package.json are skipped, an empty result is fine.
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package VSIX
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=0
          for dir in extensions/*/; do
            [ -f "$dir/package.json" ] || { echo "skip $dir (no package.json)"; continue; }
            echo "== $dir"
            ( cd "$dir" && npm ci && npm run package )
            for v in "$dir"dist/*.vsix; do echo "built $v"; built=$((built+1)); done
          done
          echo "VSIX built: $built"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extensions/*/dist/*.vsix
          if-no-files-found: ignore
          retention-days: 7

  # 2. Native build + push by digest per architecture.
  build:
    needs: extensions
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch packaged VSIX (if any)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vsix
          path: extensions
      - name: Show what goes into the image
        run: |
          ls -l extensions/*/dist/*.vsix 2>/dev/null || echo "no VSIX in this build"
          ls -d courses/*/ 2>/dev/null || echo "no courses in this build"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check CADS_ZERO_TOKEN
        run: |
          if [ -z "${{ secrets.CADS_ZERO_TOKEN }}" ]; then
            echo "::error::secret CADS_ZERO_TOKEN is not set - the private cads-zero clone will fail (gh secret set CADS_ZERO_TOKEN)"; exit 1
          fi
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          secrets: |
            gh_token=${{ secrets.CADS_ZERO_TOKEN }}
          build-args: |
            ${{ inputs.cads_zero_ref != '' && format('CADS_ZERO_REF={0}', inputs.cads_zero_ref) || '' }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          provenance: false
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "${{ matrix.arch }}: $digest"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 3. One multi-arch manifest, tagged.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest and tags
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME//\//-}"
          short="${GITHUB_SHA::7}"
          tags=("$IMAGE:$branch-$short" "$IMAGE:$branch")
          [ "$GITHUB_REF_NAME" = "main" ] && tags+=("$IMAGE:latest")
          args=()
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          cd /tmp/digests
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)
          echo "tags: ${tags[*]}"
      - name: Inspect
        run: |
          docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
