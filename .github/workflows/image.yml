# CaDS Firmware Lab - multi-arch image build for ghcr.io/scimbe/cads-firmware-lab.
#
# The firmware smoke build inside the Dockerfile (cmake --preset itsboard, host
# ctest) is far too slow under QEMU, so each architecture is built natively:
# ubuntu-latest (amd64) and ubuntu-24.04-arm (arm64) push one image by digest,
# a final job stitches them into one multi-arch manifest with the tags
#   <branch>-<shortsha>, <branch>, and (main only) latest.
#
# No repository secret: the workspace seed comes from the public mirror
# scimbe/cads-zero-firmware (branch praktikum/start, see Dockerfile). The old
# CADS_ZERO_TOKEN secret is no longer used and can be deleted.

name: image

on:
  push:
    branches: [next, main]
    paths:
      - Dockerfile
      - .dockerignore
      - image/**
      - extensions/**
      - courses/**
      - e2e/logout-smoke.mjs
      - tests/logout/**
      - .github/workflows/image.yml
  workflow_dispatch:
    inputs:
      cads_zero_ref:
        description: firmware branch or 40-hex commit to seed (default praktikum/start, see Dockerfile)
        required: false
        default: ""

env:
  IMAGE: ghcr.io/scimbe/cads-firmware-lab

jobs:
  # 0. Resolve the seed ref to ONE commit, so both architectures seed the same
  #    firmware state and the image can say which (OCI label + file, see
  #    Dockerfile). Public mirror, no token.
  seed:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - name: Resolve seed commit
        id: resolve
        shell: bash
        env:
          REPO: https://github.com/scimbe/cads-zero-firmware.git
          REF: ${{ inputs.cads_zero_ref || 'praktikum/start' }}
        run: |
          set -euo pipefail
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            commit="$REF"
          else
            commit="$(git ls-remote "$REPO" "refs/heads/$REF" | cut -f1)"
          fi
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot resolve $REF in $REPO"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "seed: $REPO $REF -> $commit" | tee -a "$GITHUB_STEP_SUMMARY"

  # 1. Package the CaDS extensions (cads-probe, cads-board-bridge, cads-tutor,
  #    cads-logout) into extensions/*/dist/*.vsix. Tolerant: directories that do not exist
  #    yet or have no package.json are skipped, an empty result is fine.
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package VSIX
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=0
          for dir in extensions/*/; do
            [ -f "$dir/package.json" ] || { echo "skip $dir (no package.json)"; continue; }
            echo "== $dir"
            ( cd "$dir" && npm ci && npm run package )
            for v in "$dir"dist/*.vsix; do echo "built $v"; built=$((built+1)); done
          done
          echo "VSIX built: $built"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: extensions/*/dist/*.vsix
          if-no-files-found: ignore
          retention-days: 7

  # 2. Native build + push by digest per architecture.
  build:
    needs: [extensions, seed]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Fetch packaged VSIX (if any)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vsix
          path: extensions
      - name: Show what goes into the image
        run: |
          ls -l extensions/*/dist/*.vsix 2>/dev/null || echo "no VSIX in this build"
          ls -d courses/*/ 2>/dev/null || echo "no courses in this build"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            CADS_ZERO_REF=${{ needs.seed.outputs.ref }}
            CADS_SEED_COMMIT=${{ needs.seed.outputs.commit }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          provenance: false
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
          echo "${{ matrix.arch }}: $digest"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 3. One multi-arch manifest, tagged.
  manifest:
    needs: [build, seed]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest and tags
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME//\//-}"
          short="${GITHUB_SHA::7}"
          tags=("$IMAGE:$branch-$short" "$IMAGE:$branch")
          [ "$GITHUB_REF_NAME" = "main" ] && tags+=("$IMAGE:latest")
          args=()
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          cd /tmp/digests
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)
          echo "tags: ${tags[*]}"
      - name: Inspect
        run: |
          docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
      - name: Check the seed label of every architecture
        shell: bash
        env:
          WANT: ${{ needs.seed.outputs.commit }}
        run: |
          set -euo pipefail
          ref="$IMAGE:${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          docker buildx imagetools inspect "$ref" --format '{{json .Image}}' > /tmp/image.json
          python3 - "$WANT" <<'PY'
          import json, sys
          want = sys.argv[1]
          images = json.load(open("/tmp/image.json"))
          if "config" in images:            # single-platform shape
              images = {"single": images}
          bad = 0
          for plat, img in images.items():
              labels = img.get("config", {}).get("Labels", {}) or {}
              got = labels.get("org.cads.seed.commit", "")
              print(f"{plat}: org.cads.seed.commit={got} ref={labels.get('org.cads.seed.ref','')}")
              bad += got != want
          sys.exit(1 if bad else 0)
          PY
          echo "seed label = $WANT on all architectures" >> "$GITHUB_STEP_SUMMARY"

  # 4. Logout (docs/LOGOUT.md). Unit tests need no image and run at once; the
  #    browser test runs against the image this workflow just pushed, in both
  #    operating modes plus the fallback without the extension.
  logout-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Page script, installer, entrypoint config
        run: node --test tests/logout/*.test.mjs
      - name: cads-logout extension
        working-directory: extensions/cads-logout
        run: npm ci && npm run typecheck && npm test

  logout-smoke:
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      CADS_LAB_PASSWORD: logout-smoke-${{ github.run_id }}
      # Last image on :next without the logout (before PR #6).
      PORTAL_OLD_TAG: next-54cb23d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the image in both modes (and once without the extension)
        shell: bash
        run: |
          set -euo pipefail
          ref="$IMAGE:${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"
          common=(--bind-addr 0.0.0.0:8080 --disable-workspace-trust --disable-telemetry --disable-update-check)
          ws=/home/coder/workspace/cads-zero
          # portal mode: what praktikum-creator starts (compose.user.template.yml +
          # compose.user.code-server.yml): --auth none, the template's environment,
          # CADS_LOGOUT_URL=/start/logout (launcher route, praktikum-creator #191),
          # and the per-person volume workspace-<id> on /home/coder/workspace. That
          # volume outlives image updates, so it is filled here by the image that
          # was on :next BEFORE the logout existed - a session of someone who used
          # the lab earlier, not a fresh one.
          old="$IMAGE:$PORTAL_OLD_TAG"
          docker volume create logout-smoke-workspace
          docker run --rm -v logout-smoke-workspace:/home/coder/workspace "$old" --version
          docker run --rm -v logout-smoke-workspace:/home/coder/workspace --entrypoint sh "$ref" -c \
            'test -d /home/coder/workspace/cads-zero/.git && cat /home/coder/workspace/cads-zero/.cads-seed-applied 2>/dev/null | head -3'
          docker run -d --name logout-none -p 127.0.0.1:18081:8080 \
            -v logout-smoke-workspace:/home/coder/workspace \
            -e ALLOWED_EMAIL=e2e@example.org -e ADMIN_EMAILS= -e PRAKTIKUM_USER=e2e -e APPROVAL_EXPIRES= \
            -e PASSWORD=unused-in-portal-mode -e CUSTOM_USER=cads \
            -e CADS_LOGOUT_URL=/start/logout \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=credential.helper \
            -e GIT_CONFIG_VALUE_0=/run/cads-git-cred/git-credential-broker.py \
            "$ref" --bind-addr 0.0.0.0:8080 --auth none --app-name "CaDS Firmware Lab" \
            --disable-workspace-trust --disable-telemetry --disable-update-check "$ws"
          # interim mode: the image's own CMD, code-server password
          docker run -d --name logout-password -p 127.0.0.1:18082:8080 -e "PASSWORD=$CADS_LAB_PASSWORD" "$ref"
          docker run -d --name logout-fallback -p 127.0.0.1:18083:8080 "$ref" "${common[@]}" --auth none --extensions-dir /tmp/no-extensions "$ws"
          for port in 18081 18082 18083; do
            for i in $(seq 1 60); do
              curl -fsS -o /dev/null "http://127.0.0.1:$port/healthz" && break
              [ "$i" = 60 ] && { echo "::error::no /healthz on port $port"; docker ps -a; exit 1; }
              sleep 2
            done
          done
          docker exec logout-none sh -c "printf 'logout e2e\n' > $ws/logout-e2e.txt"
          docker logs logout-none 2>&1 | grep -F '[cads-logout] Abmelde-Adresse: /start/logout'
          docker exec logout-none code-server --list-extensions | grep -Fx cads.cads-logout
      - name: Install Playwright
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium-headless-shell
      - name: Browser test
        env:
          CADS_LOGOUT_NONE_URL: http://127.0.0.1:18081
          CADS_LOGOUT_PASSWORD_URL: http://127.0.0.1:18082
          CADS_LOGOUT_FALLBACK_URL: http://127.0.0.1:18083
          CADS_LOGOUT_EXPECT_VIA: /start/logout
          CADS_LOGOUT_EDIT_FILE: logout-e2e.txt
          CADS_LOGOUT_READ_CMD: docker exec logout-none cat /home/coder/workspace/cads-zero/logout-e2e.txt
          E2E_OUT: e2e/out
        run: PW_MODULE="$RUNNER_TEMP/pw/node_modules/playwright" node e2e/logout-smoke.mjs
      - name: Container logs
        if: failure()
        run: for c in logout-none logout-password logout-fallback; do echo "== $c"; docker logs "$c" 2>&1 | tail -40; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logout-smoke-screenshots
          path: e2e/out/
          if-no-files-found: ignore
          retention-days: 7
